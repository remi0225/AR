<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A-Frame a-box</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <style>
      html, body { margin: 0; height: 100%; }
      a-scene { width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <a-scene background="color: #111">
      <a-entity position="0 1.6 0">
        <a-camera></a-camera>
      </a-entity>

      <a-box
        position="0 1 -3"
        rotation="0 45 0"
        width="1"
        height="1"
        depth="1"
        color="#4CC3D9"
        shadow>
      </a-box>

      <a-plane
        position="0 0 -3"
        rotation="-90 0 0"
        width="10"
        height="10"
        color="#444"
        shadow>
      </a-plane>

      <a-light type="ambient" intensity="0.5"></a-light>
      <a-light type="directional" intensity="0.9" position="1 3 2"></a-light>
    </a-scene>
  </body>
</html>
